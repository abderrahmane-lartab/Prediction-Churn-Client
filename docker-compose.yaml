services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    working_dir: /mlflow
    command: >-
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/mlruns
    ports:
      - "5000:5000"
    volumes:
      - ./:/mlflow

  streamlit:
    image: python:3.14-slim
    working_dir: /app
    command: >-
      sh -c "python -m pip install --no-cache-dir streamlit
      && streamlit run app/app.py --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - ./:/app